{% extends 'shop/base.html' %}{% block title %}فروشگاه عروسک | KNOVA{% endblock %}{% block content %}<main class="listing"><div class="page-head"><i>دنیای کوچکِ دوست‌داشتنی‌ها</i><h1>فروشگاه عروسک KNOVA</h1></div><form class="filters"><input name="q" value="{{query}}" placeholder="دنبال چه چیزی هستید؟"><select name="category"><option value="">همه دسته‌ها</option>{% for c in categories %}<option value="{{c.slug}}" {% if selected == c.slug %}selected{% endif %}>{{c.title}}</option>{% endfor %}</select><select name="sort"><option value="new">جدیدترین‌ها</option><option value="cheap">ارزان‌ترین</option><option value="expensive">گران‌ترین</option></select><button class="button">نمایش</button></form><div class="product-grid">{% for product in products %}{% include 'shop/product_card.html' %}{% empty %}<p>چیزی مطابق جست‌وجوی شما پیدا نشد.</p>{% endfor %}</div></main>{% endblock %}
