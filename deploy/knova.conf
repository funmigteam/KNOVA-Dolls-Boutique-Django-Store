server {
    listen 80;
    listen 443 ssl;
    server_name knova.ir www.knova.ir;
    ssl_certificate /etc/nginx/knova-tls/origin.crt;
    ssl_certificate_key /etc/nginx/knova-tls/origin.key;
    include /etc/nginx/snippets/funmig-security.conf;
    client_max_body_size 20m;

    location /static/ {
        alias "/srv/knova/staticfiles/";
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        alias "/srv/knova/media/";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:8014;
        include /etc/nginx/snippets/funmig-proxy.conf;
    }
}
